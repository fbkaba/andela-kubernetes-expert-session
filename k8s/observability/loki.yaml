apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config}
data:
  config.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /loki
      storage:
        filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}
      replication_factor: 1
      ring: {instance_addr: 127.0.0.1, kvstore: {store: inmemory}}
    schema_config:
      configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki}
spec:
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.2.0
        args: ["-config.file=/etc/loki/config.yaml"]
        ports: [{containerPort: 3100}]
        volumeMounts: [{name: config, mountPath: /etc/loki}]
      volumes: [{name: config, configMap: {name: loki-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: loki}
spec: {selector: {app: loki}, ports: [{port: 3100, targetPort: 3100}]}
