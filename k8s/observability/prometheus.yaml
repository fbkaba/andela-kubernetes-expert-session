apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s}
    scrape_configs:
    - job_name: gateway
      static_configs: [{targets: ["gateway:8080"]}]
    - job_name: order-service
      static_configs: [{targets: ["order-service:8081"]}]
    - job_name: recommendation-service
      static_configs: [{targets: ["recommendation-service:8082"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args: ["--config.file=/etc/prometheus/prometheus.yml"]
        ports: [{containerPort: 9090}]
        volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: 9090}]}
