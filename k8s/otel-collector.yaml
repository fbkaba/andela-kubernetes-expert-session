apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls: {insecure: true}
      debug: {verbosity: basic}
    processors:
      batch: {}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.110.0
        args: ["--config=/etc/otelcol/config.yaml"]
        ports:
        - {containerPort: 4317}
        - {containerPort: 4318}
        volumeMounts:
        - {name: config, mountPath: /etc/otelcol}
      volumes:
      - name: config
        configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector}
spec:
  selector: {app: otel-collector}
  ports:
  - {name: grpc, port: 4317, targetPort: 4317}
  - {name: http, port: 4318, targetPort: 4318}
