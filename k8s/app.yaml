apiVersion: apps/v1
kind: Deployment
metadata: {name: recommendation-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: recommendation-service}}
  template:
    metadata: {labels: {app: recommendation-service}}
    spec:
      containers:
      - name: app
        imagePullPolicy: Never
        image: andela-recommendation-service:latest
        env:
        - {name: DELAY_SECONDS, value: "3.0"}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        ports: [{containerPort: 8082}]
        readinessProbe: {httpGet: {path: /health, port: 8082}, initialDelaySeconds: 2, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: recommendation-service}
spec: {selector: {app: recommendation-service}, ports: [{port: 8082, targetPort: 8082}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
      - name: app
        imagePullPolicy: Never
        image: andela-order-service:latest
        env:
        - {name: RECOMMENDATION_URL, value: "http://recommendation-service:8082/recommend"}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        ports: [{containerPort: 8081}]
        readinessProbe: {httpGet: {path: /health, port: 8081}, initialDelaySeconds: 2, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: order-service}
spec: {selector: {app: order-service}, ports: [{port: 8081, targetPort: 8081}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
      - name: app
        imagePullPolicy: Never
        image: andela-gateway:latest
        env:
        - {name: ORDER_URL, value: "http://order-service:8081/order"}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 2, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
