global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8080"]}]
  - job_name: order-service
    static_configs: [{targets: ["order-service:8081"]}]
  - job_name: recommendation-service
    static_configs: [{targets: ["recommendation-service:8082"]}]
